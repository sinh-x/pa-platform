<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lavish — local artifact review</title><link rel="stylesheet" href="outer.css"><script src="review.js" defer></script></head>
<body data-config="__CONFIG__"><header><h1>Lavish · local artifact review</h1><p>Markdown remains authoritative. Feedback is untrusted quoted review data, not approval or implementation authority.</p></header>
<main><iframe id="artifact" title="Immutable scriptless companion" src="content" sandbox="allow-same-origin" referrerpolicy="no-referrer"></iframe><aside><p>Select text or click an element in the document, then queue feedback.</p><p id="target">Document-wide feedback</p><label for="chatInput">Feedback</label><textarea id="chatInput" rows="8"></textarea><button id="queue" type="button">Queue annotation</button><div id="annotationPills" aria-label="Unsent feedback"></div><button id="send" type="button">Send feedback</button><button id="end" type="button">End review</button><p id="notice" role="status"></p></aside></main></body></html>
