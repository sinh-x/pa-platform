name: CI

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    # Code-only CI. Immutable/sandbox and installed runtime integration are an
    # explicit manual gate, not silently skipped or certified by this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Read paired config SHA
        id: paired-config
        run: echo "sha=$(tr -d '[:space:]' < .pa-platform-config.sha)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: sinh-x/pa-platform-config
          ref: ${{ steps.paired-config.outputs.sha }}
          path: paired-config
          fetch-depth: 0
          token: ${{ secrets.PA_PLATFORM_CONFIG_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Validate pinned Pi extension sources
        run: node packages/pi-pa/scripts/validate-extension-sources.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Code tests (manual integration is separate)
        run: pnpm run test:code

      - name: Enforce config-first compatibility
        shell: bash
        env:
          PA_PHASE5_CONFIG_ROOT: ${{ github.workspace }}/paired-config
        run: |
          set -o pipefail
          git -C "$PA_PHASE5_CONFIG_ROOT" fetch origin develop
          pnpm run verify:paired-config -- --require-origin-develop | tee -a "$GITHUB_STEP_SUMMARY"
          pnpm run test:paired-gate

      - name: Record manual integration boundary
        shell: bash
        run: |
          printf '%s\n' 'Code-only checks do not certify sandbox/installed runtime integration.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Manual gate: corepack pnpm test in the supported immutable sandbox toolchain; see docs/ordinary-local-development.md.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'All 16 native workflow integration cases remain mandatory locally via pi-workflow-runtime.test.ts; this lane uses its explicit portable entry, not skipped native tests.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check generated completions
        run: |
          pnpm run completions
          git diff --exit-code -- completions/pa-core.fish completions/opa.fish completions/ppa.fish

      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish

      - name: Check fish completions
        run: |
          for completion in completions/{pa-core,opa,ppa}.fish; do
            fish --no-execute "$completion"
          done

      - name: Check fish completion timing
        run: pnpm run completions:timing
