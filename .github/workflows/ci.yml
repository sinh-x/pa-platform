name: CI

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    # PAP-owned code and fixture checks only. Operator-local pairing, immutable
    # sandbox and installed integration are separate, not certified by this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Validate pinned Pi extension sources
        run: node packages/pi-pa/scripts/validate-extension-sources.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Code tests (manual integration is separate)
        run: pnpm run test:code

      - name: Repository-owned pairing contract fixtures
        run: pnpm run test:paired-gate

      - name: Record manual integration boundary
        shell: bash
        run: |
          printf '%s\n' 'Hosted CI checks PAP code and repository-owned fixtures only.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Operator-local configuration pairing remains a separate check; no external configuration checkout or access is used by this job.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Code-only checks do not certify sandbox/installed runtime integration.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Manual gate: corepack pnpm test in the supported immutable sandbox toolchain; see docs/ordinary-local-development.md.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Selected-host gate: corepack pnpm verify:selected-pi-reader on the actual trusted host. Builder user namespaces may correctly deny root authority; their publication/namespace checks do not certify positive production reads, installation or human acceptance.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'All 16 native workflow integration cases remain mandatory locally via pi-workflow-runtime.test.ts; this lane uses its explicit portable entry, not skipped native tests.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check generated completions
        run: |
          pnpm run completions
          git diff --exit-code -- completions/pa-core.fish completions/opa.fish completions/ppa.fish

      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish

      - name: Check fish completions
        run: |
          for completion in completions/{pa-core,opa,ppa}.fish; do
            fish --no-execute "$completion"
          done

      - name: Check fish completion timing
        run: pnpm run completions:timing
